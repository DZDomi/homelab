apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: traefik
  name: traefik
spec:
  parentRefs:
    - name: traefik
      sectionName: example-com
  hostnames:
    - traefik.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: traefik
          port: 8080
