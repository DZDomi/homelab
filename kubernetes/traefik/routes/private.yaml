apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  namespace: gitea
  name: gitea-ssh
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      middlewares:
        - namespace: traefik
          name: allow-local-network
      services:
        - name: gitea-ssh
          port: 22
---
