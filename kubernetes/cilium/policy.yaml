apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: servers
spec:
  blocks:
    - start: 10.1.3.2
      stop: 10.1.3.19
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: servers
spec:
  nodeSelector:
    matchExpressions:
      - key: vlan.example.com/servers
        operator: Exists
  # 10.1.4.x services must only be announced from nodes on the external VLAN
  serviceSelector:
    matchExpressions:
      - key: vlan.example.com/external
        operator: DoesNotExist
  externalIPs: true
  loadBalancerIPs: true
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: external
spec:
  blocks:
    - start: 10.1.4.2
      stop: 10.1.4.19
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: external
spec:
  nodeSelector:
    matchExpressions:
      - key: vlan.example.com/external
        operator: Exists
  serviceSelector:
    matchExpressions:
      - key: vlan.example.com/external
        operator: Exists
  externalIPs: true
  loadBalancerIPs: true