apiVersion: v1
kind: Secret
metadata:
  namespace: paperless-ngx
  name: paperless-ngx
stringData:
  PAPERLESS_DBHOST: "paperless-ngx-cluster-rw.cnpg-database.svc.cluster.local"
  PAPERLESS_DBNAME: "app"
  PAPERLESS_DBUSER: "app"
  # copy from the cnpg-generated secret: kubectl -n cnpg-database get secret paperless-ngx-cluster-app -o jsonpath='{.data.password}' | base64 -d
  PAPERLESS_DBPASS: "SETME"
  PAPERLESS_SECRET_KEY: "SETME"
  PAPERLESS_ADMIN_USER: "admin"
  PAPERLESS_ADMIN_PASSWORD: "SETME"
