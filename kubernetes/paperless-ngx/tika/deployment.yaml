apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: paperless-ngx
  name: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      labels:
        app: tika
    spec:
      containers:
        - name: tika
          image: apache/tika:4.1.0
          ports:
            - name: http
              containerPort: 9998
