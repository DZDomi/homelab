apiVersion: v1
kind: Service
metadata:
  namespace: blocky
  name: blocky-dns
  annotations:
    lbipam.cilium.io/ips: 10.1.3.2
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  selector:
    app: blocky
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  namespace: blocky
  name: blocky-web
spec:
  type: ClusterIP
  selector:
    app: blocky
  ports:
    - name: http
      port: 4000
      targetPort: http