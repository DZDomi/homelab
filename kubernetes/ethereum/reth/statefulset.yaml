apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: ethereum
  name: reth
spec:
  replicas: 1
  serviceName: reth
  selector:
    matchLabels:
      app: reth
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
        prometheus.io/path: /metrics
      labels:
        app: reth
    spec:
      initContainers:
        - name: get-external-ip
          image: alpine/curl:8.22.0
          args:
            - -fsSL
            - -o
            - /run/init/external-ip
            - https://ifconfig.io
          volumeMounts:
            - name: init
              mountPath: /run/init
      containers:
        - name: reth
          image: docker-registry.example.com/reth:v2.8.1-2
          resources:
            requests:
              cpu: "4"
              memory: 20Gi
          ports:
            - name: http
              containerPort: 8545
            - name: ws
              containerPort: 8546
            - name: engine
              containerPort: 8551
            - name: metrics
              containerPort: 6060
            - name: p2p-tcp
              containerPort: 30303
            - name: p2p-udp
              containerPort: 30303
              protocol: UDP
            - name: discv5
              containerPort: 9200
              protocol: UDP
          volumeMounts:
            - name: storage
              mountPath: /var/lib/reth
            - name: init
              mountPath: /run/init
            - name: engine-auth-rpc
              readOnly: true
              mountPath: /shared/jwt.hex
              subPath: jwt.hex
      volumes:
        - name: init
          emptyDir: {}
        - name: engine-auth-rpc
          secret:
            secretName: engine-auth-rpc
      terminationGracePeriodSeconds: 300
      nodeSelector:
        vlan.example.com/external: "true"
      # Keep reth off lighthouse's node so its DB gets the page cache to itself
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: lighthouse
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        storageClassName: iscsi-nvme
        accessModes:
         - ReadWriteOnce
        resources:
          requests:
            storage: 600Gi
