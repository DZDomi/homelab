apiVersion: v1
kind: Service
metadata:
  namespace: ethereum
  name: reth
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: reth
  ports:
    - name: engine
      port: 8551
      targetPort: engine
---
apiVersion: v1
kind: Service
metadata:
  namespace: ethereum
  name: reth-p2p
  labels:
    vlan.example.com/external: "true"
  annotations:
    lbipam.cilium.io/ips: 10.1.4.2
spec:
  type: LoadBalancer
  selector:
    app: reth
  ports:
    - name: p2p-tcp
      port: 30303
      targetPort: p2p-tcp
    - name: p2p-udp
      port: 30303
      targetPort: p2p-udp
      protocol: UDP
    - name: discv5
      port: 9200
      targetPort: discv5
      protocol: UDP
