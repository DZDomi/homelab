apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: teslamate
  name: mosquitto-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: iscsi-nvme
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: teslamate
  name: mosquitto-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: iscsi-nvme
