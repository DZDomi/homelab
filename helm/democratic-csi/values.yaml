# Required for Talos
node:
  hostPID: true
  driver:
    image:
      registry: ghcr.io/democratic-csi/democratic-csi
      tag: next
    extraEnv:
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm
    iscsiDirHostPath: /var/iscsi
    iscsiDirHostPathType: ""
  driverRegistrar:
    image:
      registry: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.14.0

controller:
  driver:
    image:
      registry: ghcr.io/democratic-csi/democratic-csi
      tag: next
  externalAttacher:
    image:
      registry: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.13.0

  externalProvisioner:
    image:
      registry: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.3.0

  externalResizer:
    image:
      registry: registry.k8s.io/sig-storage/csi-resizer
      tag: v1.14.0

  externalSnapshotter:
    image:
      registry: registry.k8s.io/sig-storage/csi-snapshotter
      tag: v8.3.0

driver:
  config:
    httpConnection:
      protocol: https
      host: truenas.example.com
      port: 443
      allowInsecure: true
    zfs:
      zvolBlocksize: 64K
      datasetProperties:
        "org.freenas:description": "{{ parameters.[csi.storage.k8s.io/pvc/namespace] }}/{{ parameters.[csi.storage.k8s.io/pvc/name] }}"