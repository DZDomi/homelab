policy: sync

provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-credentials
        key: api-token

sources:
  - service
  - ingress
  - gateway-httproute

extraArgs:
  - --target-net-filter=10.1.3.0/24

annotationFilter: external-dns.alpha.kubernetes.io/exclude notin (true)