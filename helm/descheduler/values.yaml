kind: CronJob
schedule: "*/15 * * * *"
successfulJobsHistoryLimit: 0
failedJobsHistoryLimit: 1

deschedulerPolicy:
  # Most workloads have no resource requests, so balance on real usage from metrics-server
  metricsProviders:
    - source: KubernetesMetrics
  # One pod per namespace per run, so replicas of the same app (traefik, blocky, cnpg instances) never go down together
  maxNoOfPodsToEvictPerNamespace: 1
  maxNoOfPodsToEvictPerNode: 3
  maxNoOfPodsToEvictTotal: 5
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            # PVC pods may move (all volumes are iSCSI/NFS); cnpg-database is capped at one
            # pod per run by maxNoOfPodsToEvictPerNamespace and its primaries are guarded by PDBs
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
            # ethereum (reth, lighthouse) is never evicted
            namespaceLabelSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - velero
                    - ethereum
            # Single-replica workloads (home-assistant, ...) are never evicted
            minReplicas: 2
            nodeFit: true
            minPodAge: 1h
        - name: RemoveDuplicates
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 100
            includingInitContainers: true
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingNodeTaints
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: LowNodeUtilization
          args:
            metricsUtilization:
              source: KubernetesMetrics
            thresholds:
              cpu: 20
              memory: 20
              pods: 20
            targetThresholds:
              cpu: 50
              memory: 30
              pods: 30
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsHavingTooManyRestarts
            - RemovePodsViolatingNodeTaints
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity
