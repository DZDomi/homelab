image:
  repository: itzg/minecraft-server
  tag: latest

nodeSelector:
  vlan.example.com/servers: "true"

resources:
  requests:
    cpu: 2
    memory: 9Gi

serviceAnnotations:
  lbipam.cilium.io/ips: 10.1.3.5
  external-dns.alpha.kubernetes.io/hostname: minecraft.example.com

minecraftServer:
  eula: true
  # renovate: datasource=custom.minecraft depName=minecraft versioning=loose
  version: "26.3"
  difficulty: normal
  whitelist: player1,player2
  ops: player1
  spawnProtection: 0
  motd: Kimchi!

  memory: 8192M
  serviceType: LoadBalancer

persistence:
  storageClass: iscsi-nvme
  dataDir:
    enabled: true